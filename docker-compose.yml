services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroscan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscan-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: neuroscan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
